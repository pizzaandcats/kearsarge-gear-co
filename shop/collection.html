<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First Run | Kearsarge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=8">
</head>
<body>
<main>
  <div class="wrap">
    <div class="shop-head">
      <p class="eyebrow js-col-eyebrow">Pre-sale</p>
      <h1 class="js-col-title" style="margin-top:14px">The First Run</h1>
      <p class="js-col-blurb">Seven pieces of performance apparel for the trail and training, proportioned for men 5'3" to 5'8". Pre-order now; ships <span class="js-ship"></span>.</p>
    </div>
    <div class="toolbar">
      <nav class="filters js-filters" aria-label="Categories"></nav>
      <div style="display:flex;align-items:center;gap:18px">
        <span class="count js-count"></span>
        <select class="js-sort" aria-label="Sort">
          <option value="featured">Featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
    </div>
    <div class="grid js-grid" style="padding-bottom:112px"></div>
  </div>
</main>

<script src="data.js?v=5"></script>
<script src="shop.js?v=4"></script>
<script>
(function () {
  var S = window.KG_SHOP, UI = window.KG_UI;
  var qs = new URLSearchParams(location.search), id = qs.get('c'), aid = qs.get('a');
  var col = id ? S.collection(id) : aid ? S.activity(aid) : null;
  var key = id ? 'c' : aid ? 'a' : '';
  document.querySelector('.js-ship').textContent = S.SHIP;
  if (col) {
    document.querySelector('.js-col-eyebrow').textContent = 'The First Run';
    document.querySelector('.js-col-title').textContent = col.name;
    document.querySelector('.js-col-blurb').textContent = col.blurb;
  }
  document.title = (col ? col.name : 'The First Run') + ' | Kearsarge';

  var f = [{ id: '', k: '', name: 'All' }].concat(S.ACTIVITIES.map(function (a) { return { id: a.id, k: 'a', name: a.name }; }), S.COLLECTIONS.map(function (c) { return { id: c.id, k: 'c', name: c.name }; }));
  document.querySelector('.js-filters').innerHTML = f.map(function (c, i) {
    var on = c.k === key && (c.id || '') === ((key === 'c' ? id : aid) || '');
    return (i === 1 + S.ACTIVITIES.length ? '<span class="filter-sep" aria-hidden="true"></span>' : '') + '<a class="' + (on ? 'on' : '') + '" href="collection.html' + (c.id ? '?' + c.k + '=' + c.id : '') + '"' + (on ? ' aria-current="page"' : '') + '>' + UI.esc(c.name) + '</a>';
  }).join('');

  var grid = document.querySelector('.js-grid'), sort = document.querySelector('.js-sort');
  function draw() {
    var list = S.PRODUCTS.filter(function (p) { return !col || (key === 'c' ? p.collection === col.id : p.acts.indexOf(col.id) > -1); }).slice();
    if (sort.value === 'low') list.sort(function (a, b) { return a.price - b.price; });
    if (sort.value === 'high') list.sort(function (a, b) { return b.price - a.price; });
    grid.innerHTML = list.map(UI.card).join('');
    document.querySelector('.js-count').textContent = list.length + (list.length === 1 ? ' style' : ' styles');
  }
  sort.addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
