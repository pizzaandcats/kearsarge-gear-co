<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kearsarge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6efe3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=3">
</head>
<body>
<main>
  <div class="wrap">
    <p class="crumbs js-crumbs"></p>
    <div class="pdp">
      <div class="gallery js-gallery"></div>
      <form class="buy js-buy" novalidate>
        <div>
          <p class="eyebrow js-col"></p>
          <h1 class="js-name" style="margin-top:8px"></h1>
          <p class="tag js-tag" style="margin-top:10px"></p>
        </div>
        <p class="price js-price"></p>
        <div><p class="opt-label">Color <span class="js-color-name"></span></p><div class="chips js-colors"></div></div>
        <div class="js-opts"></div>
        <div class="fg-entry">
          <button class="fg-btn fg-btn-size" type="button" data-fg="size"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15 15 3l6 6L9 21z"/><path d="M7 11l2 2M10 8l2 2M13 5l2 2"/></svg>Find my size</button>
          <button class="fg-btn" type="button" data-fg="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask a question</button>
        </div>
        <p class="your-fit js-fit">Built for men 5'3" to 5'8". Shorter where it counts, not tighter.</p>
        <button class="btn btn-block" type="submit">Add to cart</button>
        <p class="status" role="status" aria-live="polite"></p>
        <div class="js-details"></div>
      </form>
    </div>
  </div>

  <section class="closeups js-closeups" aria-labelledby="closeups-h" hidden>
    <div class="wrap">
      <div class="car-head">
        <h2 id="closeups-h">Fits like it was made for you.</h2>
        <div class="car-btns"><button class="car-prev" type="button" aria-label="Previous">&#8592;</button><button class="car-next" type="button" aria-label="Next">&#8594;</button></div>
      </div>
    </div>
    <div class="carousel" data-carousel>
      <div class="car-track js-track" tabindex="0" role="region" aria-label="Feature close-ups"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sec-head"><h2>Complete the kit.</h2><a href="collection.html">Shop all</a></div>
      <div class="grid js-related"></div>
    </div>
  </section>
</main>

<script src="data.js?v=1"></script>
<script src="shop.js?v=1"></script>
<script src="fit-guide.js?v=1"></script>
<script>
(function () {
  var S = window.KG_SHOP, UI = window.KG_UI, esc = UI.esc;
  var p = S.product(new URLSearchParams(location.search).get('p')) || S.PRODUCTS[0];
  var col = S.collection(p.collection);
  document.title = p.name + ' | Kearsarge';

  document.querySelector('.js-crumbs').innerHTML = '<a href="index.html">Home</a> / <a href="collection.html?c=' + col.id + '">' + esc(col.name) + '</a> / ' + esc(p.name);
  document.querySelector('.js-col').textContent = col.name;
  document.querySelector('.js-name').textContent = p.name;
  document.querySelector('.js-tag').textContent = p.tagline;
  document.querySelector('.js-price').textContent = UI.money(p.price);
  document.querySelector('.js-gallery').innerHTML = p.images.map(function (src, i) {
    return '<img src="' + src.replace(/w=\d+&h=\d+/, i === 0 ? 'w=1400&h=1400' : 'w=800&h=1000') + '" alt="' + esc(p.name) + ', photo ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '>';
  }).join('');

  // Color
  var colorName = document.querySelector('.js-color-name');
  document.querySelector('.js-colors').innerHTML = p.colors.map(function (k, i) {
    var c = S.COLORS[k];
    return '<label class="chip swatch" title="' + esc(c.name) + '"><input type="radio" name="color" value="' + k + '"' + (i === 0 ? ' checked' : '') + ' aria-label="' + esc(c.name) + '"><span style="background:' + c.hex + '"></span></label>';
  }).join('');
  colorName.textContent = S.COLORS[p.colors[0]].name;

  // Size options by fit type
  var chips = function (name, vals) { return '<div class="chips">' + vals.map(function (v) { return '<label class="chip"><input type="radio" name="' + name + '" value="' + esc(v) + '"><span>' + esc(v) + '</span></label>'; }).join('') + '</div>'; };
  var block = function (label, hint, name, vals) { return '<div style="margin-bottom:18px"><p class="opt-label">' + label + ' <span>' + hint + '</span></p>' + chips(name, vals) + '</div>'; };
  var opts = document.querySelector('.js-opts'), need;
  if (p.fit === 'top') {
    opts.innerHTML = block('Height', 'Sets the length', 'h', S.HEIGHTS) + block('Chest', 'Your usual size', 'c', S.CHESTS);
    need = ['h', 'c'];
  } else if (p.fit === 'bottom') {
    opts.innerHTML = block('Waist', 'Inches', 'w', S.WAISTS) + block('Inseam', 'Pick where it ends', 'i', p.inseams);
    need = ['w', 'i'];
  } else {
    opts.innerHTML = block('Size', 'Shorter fingers in every size', 'g', S.GLOVES);
    need = ['g'];
  }

  var form = document.querySelector('.js-buy'), status = form.querySelector('.status');

  // Fill the size pickers from the fit guide (or the home page fit finder)
  var fitNote = document.querySelector('.js-fit');
  function applySize(size, label, fromGuide) {
    var ok = Object.keys(size).every(function (n) {
      var r = Array.prototype.filter.call(opts.querySelectorAll('[name="' + n + '"]'), function (x) { return x.value === size[n]; })[0];
      if (r) r.checked = true; return !!r;
    });
    if (!ok) return false;
    fitNote.innerHTML = 'Your size: <b>' + esc(label) + '</b>. ' + (fromGuide ? 'From the fit guide.' : 'From your last size check.');
    if (p.fit === 'top') try { localStorage.setItem('kg_mock_fit', JSON.stringify({ h: size.h, c: size.c })); } catch (e) {}
    return true;
  }
  var known = window.KG_FIT.savedSize(p);
  if (known) applySize(known.size, known.label, false);
  else if (p.fit === 'top') try { var mf = JSON.parse(localStorage.getItem('kg_mock_fit') || 'null'); if (mf) applySize({ h: mf.h, c: mf.c }, mf.c + ' chest · ' + mf.h + ' length', false); } catch (e) {}
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-fg]'); if (!b) return;
    window.KG_FIT.open(p, { mode: b.getAttribute('data-fg'), onSize: function (size, label) {
      if (applySize(size, label, true)) { status.textContent = 'Size set. Add to cart when you\'re ready.'; form.querySelector('[type=submit]').focus(); }
    } });
  });

  // Details
  document.querySelector('.js-details').innerHTML = Object.keys(p.details).map(function (k, i) {
    return '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(k) + '</summary><p>' + esc(p.details[k]) + '</p></details>';
  }).join('') + '<details><summary>Shipping and returns</summary><p>Mock store: nothing ships. Placeholder for free shipping over $100 and free exchanges on fit.</p></details>'
    + '<p class="fg-more">Something else about the ' + esc(p.name) + '? <button type="button" data-fg="ask">Ask the fit guide</button></p>';

  form.addEventListener('change', function (e) {
    if (e.target.name === 'color') colorName.textContent = S.COLORS[e.target.value].name;
    status.textContent = '';
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var val = function (n) { var el = form.querySelector('[name="' + n + '"]:checked'); return el ? el.value : ''; };
    var missing = need.filter(function (n) { return !val(n); });
    if (missing.length) { status.textContent = 'Pick your ' + (p.fit === 'top' ? 'height and chest' : p.fit === 'bottom' ? 'waist and inseam' : 'size') + ' first.'; return; }
    var size = p.fit === 'top' ? val('c') + ' / ' + val('h') : p.fit === 'bottom' ? val('w') + ' waist / ' + val('i') + ' inseam' : val('g');
    UI.add({ id: p.id, color: val('color'), size: size });
  });

  // Close-up carousel
  if (p.features && p.features.length) {
    document.querySelector('.js-track').innerHTML = p.features.map(function (f) {
      return '<figure class="car-slide"><img src="' + f[2] + '" alt="" loading="lazy"><figcaption><b>' + esc(f[0]) + '</b><span>' + esc(f[1]) + '</span></figcaption></figure>';
    }).join('');
    document.querySelector('.js-closeups').hidden = false;
  }

  // Related: one from each other collection
  var rel = S.COLLECTIONS.filter(function (c) { return c.id !== p.collection; }).map(function (c) {
    return S.PRODUCTS.filter(function (x) { return x.collection === c.id; })[0];
  });
  rel.push(S.PRODUCTS.filter(function (x) { return x.collection === p.collection && x.id !== p.id; })[0]);
  document.querySelector('.js-related').innerHTML = rel.filter(Boolean).slice(0, 4).map(UI.card).join('');
})();
</script>
<script src="../assets/kg-carousel.js?v=1"></script>
</body>
</html>
